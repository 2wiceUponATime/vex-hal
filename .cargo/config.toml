[alias]
xtask = "run --manifest-path xtask/Cargo.toml --target host-tuple --"
with-v5 = "xtask --platform v5"
with-exp = "xtask --platform exp"
with-iq2 = "xtask --platform iq2"
test-host = "test --no-default-features --features platform-mock --target host-tuple"
