[package]
license = "MIT"
name = "vex-hal"
version = "0.1.0"
edition = "2024"

[features]
default = ["platform-exp"]
platform-exp = []
platform-iq2 = []
platform-v5 = ["dep:vex-sdk-jumptable"]

[dependencies]
async-task = { version = "4.7.1", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await", "async-await-macro"] }
spin = "0.12.3"
talc = "5.1.1"
vex-hal-macros = { version = "0.1.0", path = "macros" }
vex-sdk-jumptable = { version = "0.2.0", optional = true }
waker-fn = "1.2.0"

[workspace]
members = ["macros"]
# If xtask is a workspace member, rust-analyzer will check it with the embedded target
exclude = ["xtask"]

[lib]
test = false
bench = false

[[bin]]
name = "vex-hal"
test = false
bench = false
