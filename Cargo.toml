[package]
license = "MIT"
name = "vex-hal"
version = "0.1.0"
edition = "2024"

[features]
default = ["platform-exp"]
platform-exp = []
platform-iq2 = []
platform-v5 = ["dep:vex-sdk-jumptable"]

[dependencies]
async-task = { version = "4.7.1", default-features = false }
bitflags = "2.13.2"
derive_more = { version = "2.1.1", default-features = false, features = [
  "full",
] }
easy-ext = "1.0.3"
futures-util = { version = "0.3.34", default-features = false, features = [
  "alloc",
  "async-await",
  "async-await-macro",
] }
libm = "0.2.16"
num-traits = { version = "0.2.19", default-features = false, features = [
  "libm",
] }
snafu = { version = "0.9.2", default-features = false, features = [
  "alloc",
  "rust_1_81",
] }
spin = "0.12.3"
talc = "5.1.1"
vex-hal-macros = { version = "0.1.0", path = "macros" }
vex-sdk-jumptable = { version = "0.2.0", optional = true }
waker-fn = "1.2.0"

[workspace]
members = ["macros"]
# If xtask is a workspace member, rust-analyzer will check it with the embedded target
exclude = ["xtask"]

[lib]
test = false
bench = false

[[bin]]
name = "vex-hal"
test = false
bench = false
