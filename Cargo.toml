[package]
license = "MIT"
name = "vex-hal"
version = "0.1.0"
edition = "2024"

[features]
default = ["platform-exp"]
platform-exp = []
platform-iq2 = []
platform-v5 = ["dep:vex-sdk-jumptable"]

[dependencies]
spin = "0.12.3"
talc = "5.1.1"
vex-hal-macros = { version = "0.1.0", path = "macros" }
vex-sdk-jumptable = { version = "0.2.0", optional = true }

[workspace]
members = ["macros"]

[lib]
test = false
bench = false

[[bin]]
name = "vex-hal"
test = false
bench = false
