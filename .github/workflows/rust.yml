name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build | EXP
      run: cargo with-exp build --verbose
    - name: Build | V5
      run: cargo +nightly with-v5 build --verbose
    - name: Run tests
      run: cargo test-host --verbose
